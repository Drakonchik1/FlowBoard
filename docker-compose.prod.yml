# Production stack — SQL Server and Redis are internal-only (no host ports).
# Usage: docker compose -f docker-compose.prod.yml up -d
# Requires .env: MSSQL_SA_PASSWORD, JWT_SECRET_KEY, REDIS_PASSWORD, ALLOWED_ORIGINS__0
#
# Single API replica required: board group eviction is process-local (Redis backplane does not
# share membership across instances). Scale SQL/Redis independently; run one API container until
# distributed eviction is implemented.
#
# Migrations do not auto-run in Production. Before first traffic, from a dev machine:
#   dotnet ef database update --project src/FlowBoard.Infrastructure --startup-project src/FlowBoard.API
#   (set ConnectionStrings__DefaultConnection to the prod SQL Server connection string)
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: flowboard-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
      MSSQL_PID: "Express"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -No
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: flowboard-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/FlowBoard.API/Dockerfile
    container_name: flowboard-api
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=FlowBoard;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      Jwt__SecretKey: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env (>= 32 chars)}"
      Jwt__Issuer: "FlowBoard.API"
      Jwt__Audience: "FlowBoard.Client"
      AllowedOrigins__0: "${ALLOWED_ORIGINS__0:?Set ALLOWED_ORIGINS__0 in .env (frontend origin for CORS)}"
      ForwardedHeaders__Enabled: "${FORWARDED_HEADERS_ENABLED:-false}"
      # Optional — set when behind Railway/Azure/nginx (see README ForwardedHeaders section)
      # Hangfire__DashboardAdminEmails__0: "${HANGFIRE_ADMIN_EMAIL:-}"
      # Smtp__Host: "${SMTP_HOST:-}"
      # Smtp__FromEmail: "${SMTP_FROM_EMAIL:-}"
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  sqlserver_data:
  redis_data:
